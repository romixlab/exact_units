name: CI

# clippy and rustdoc use --all-features to cover feature gated code. Tests can't: with `defmt` enabled, host test
# binaries fail to link, as there is no defmt global logger.

on:
  merge_group:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false
      - run: cargo fmt --all --check

  cargo-sort:
    name: cargo sort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      - run: cargo sort --check

  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # without the wire format: plain Rust types only
      - run: cargo clippy --all-targets --no-default-features --features std -- -D warnings

  doc:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - run: cargo doc --no-deps --all-features

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # tests/q_asm.rs builds tools/q_literal_asm for them and reads the asm
          target: thumbv6m-none-eabi, thumbv7em-none-eabihf
          # tests/compile_fail's .stderr snapshots quote core's source: without it rustc prints them differently
          components: rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # the defaults, the wire format and the customary units (with their docs tables)
      - run: cargo nextest run --features shrink_wrap,customary,nuclear,serde,leap_seconds
      # without shrink_wrap (no wire format, plain Rust types) and with it but without std
      - run: cargo nextest run --no-default-features --features std
      - run: cargo nextest run --no-default-features --features shrink_wrap,quantities,serde
      # nextest does not run doctests
      - run: cargo test --doc --features shrink_wrap,customary,nuclear,serde,leap_seconds

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # rust-src: tests/compile_fail's snapshots, as in the test job
          components: llvm-tools-preview, rust-src
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # the same feature sets as the test job, merged into one report
      - run: cargo llvm-cov nextest --no-report --features shrink_wrap,customary,nuclear,serde,leap_seconds
      - run: cargo llvm-cov nextest --no-report --no-default-features --features std
      - run: cargo llvm-cov nextest --no-report --no-default-features --features shrink_wrap,quantities,serde
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          # a fork PR has no access to the repo's CODECOV_TOKEN secret
          fail_ci_if_error: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  no-std:
    name: no_std build (thumbv6m)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: thumbv6m-none-eabi
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features time,electrical,information
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features leap_seconds
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features shrink_wrap,defmt,time,serde
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features angle,dimensionless,counting,serde

  no-std-libm:
    name: no_std build with libm (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: thumbv7em-none-eabihf
      # levels in dB without std: log10 and 10^x from libm, in f32 on a Cortex-M4F
      - run: cargo build --target thumbv7em-none-eabihf --no-default-features --features electrical,libm
