name: Book

# The book (docs/, zensical.toml): built strict on every change, so a broken page, link or figure fails CI. The
# deploy job publishes the built site to GitHub Pages with actions/deploy-pages (Pages source "GitHub Actions"; the
# domain exact.vhrd.tech is a repository setting, no CNAME file). It runs only when started by hand (see the job).

on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the built book to GitHub Pages"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build the book (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      # the site's Markdown extensions (the `bits` fence, `rust,compile_fail` blocks)
      - run: uv run --group dev pytest -q docs_ext
      # KaTeX, the logo and the plots, then the site: a warning fails
      - run: just docs-build
      # the artifact deploy-pages publishes; also downloadable from the run to look at a pull request's book
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
          retention-days: 7

  # Runs only when started by hand on main with "deploy" ticked. To publish on every push to main, extend the `if`
  # with `|| (github.event_name == 'push' && github.ref == 'refs/heads/main')`.
  deploy:
    name: publish to GitHub Pages
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
