name: Book

# The book (docs/, zensical.toml): built strict on every change, so a broken page, link or figure fails CI. The
# deploy job publishes the built site to GitHub Pages with actions/deploy-pages (Pages source "GitHub Actions"; the
# domain exact.vhrd.tech is a repository setting, no CNAME file). It runs on every push to main, and by hand on main
# with "deploy" ticked (see the job).
#
# Concurrency: a pull request or merge-queue entry still cancels its own superseded runs (one group per branch or
# queue entry, cancel-in-progress true). Every run on main — a push or a manual "deploy" dispatch — instead shares
# one fixed group with cancel-in-progress false, covering both jobs. GitHub then runs at most one run per group and
# keeps at most one pending behind it, the most recently queued one, cancelling an older pending run outright
# (docs.github.com, "Control the concurrency of workflows and jobs"). So on main: a running build+deploy is never
# interrupted mid-deploy, two main runs never build or deploy at once, and a commit superseded before its run starts
# is dropped whole rather than left to publish late over a newer one. This is the same "pages" group GitHub's own
# Pages starter workflow (actions/starter-workflows pages/static.yml) puts on its one job; here it is the whole
# workflow's group instead of a single job's, because build (unlike deploy) also runs for pull requests and the
# merge queue and must keep cancelling per branch there.

on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the built book to GitHub Pages"
        type: boolean
        default: false

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && 'main' || (github.head_ref || github.run_id) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: build the book (strict)
    runs-on: ubuntu-latest
    env:
      # eu_docs_ext.vendor's cache (KaTeX, IBM Plex, the Noto fallbacks): cached across runs below, keyed by the
      # script's own hash, so a pin that hasn't changed needs no network even on a fresh runner.
      EU_VENDOR_CACHE: ${{ github.workspace }}/.cache/book-vendor
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: actions/cache@v4
        with:
          path: ${{ env.EU_VENDOR_CACHE }}
          key: book-vendor-${{ hashFiles('docs_ext/eu_docs_ext/vendor.py') }}
      # the site's Markdown extensions (the `bits` fence, `rust,compile_fail` blocks)
      - run: uv run --group dev pytest -q docs_ext
      # KaTeX, the logo and the plots, then the site: a warning fails
      - run: just docs-build
      # the built site's search, queried with the site's own search worker: a macro's query finds its page first
      - run: EU_SITE=site uv run --group dev pytest -q docs_ext/tests/test_search.py
      # the artifact deploy-pages publishes; also downloadable from the run to look at a pull request's book
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
          retention-days: 7

  # Runs on every push to main, and when started by hand on main with "deploy" ticked (to publish again without a
  # push). Not for pull requests or the merge queue: those only build.
  deploy:
    name: publish to GitHub Pages
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main')
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
