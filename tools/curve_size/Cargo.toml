# A PQ encode by exact_units' two certified edges, the float-free one (integer intervals) and the f64 one (libm,
# f64 in software on the single-precision FPU): two firmware images for a Cortex-M4F whose flash
# tests/curve_size.rs measures. Not part of the crate: a workspace of its own, never published.
[package]
name = "curve_size"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "certified"
test = false
bench = false

[[bin]]
name = "float"
test = false
bench = false

[dependencies]
exact_units = { path = "../..", default-features = false, features = ["libm", "photometric"] }

# as a firmware's release build: small, whole-program
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
panic = "abort"

[profile.dev]
panic = "abort"
