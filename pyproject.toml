# The book's site (docs/, zensical.toml): Zensical and the site's own Markdown extensions (docs_ext/eu_docs_ext).
# Not a Python package of the crate: `uv run zensical ...` through `just docs` and `just docs-build`.
[project]
name = "exact-units-book"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["zensical==0.0.74"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["docs_ext/eu_docs_ext"]

[dependency-groups]
dev = ["mini-racer>=0.12", "pytest>=8"]

[tool.pytest.ini_options]
# mini-racer's ctypes structures (eu_docs_ext.search), on Python 3.14
filterwarnings = ["ignore:Due to '_pack_':DeprecationWarning"]
