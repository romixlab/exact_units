[package]
name = "exact_units"
version = "0.1.0"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
description = "Units of measure fixed at compile time: dimensions, exact scales and numbers with their unit in the type, no_std and no alloc"
edition = "2024"
license = "MIT"
repository = "https://github.com/romixlab/exact_units"
keywords = ["units", "no_std", "embedded", "dimensional-analysis", "fixed-point"]
categories = ["no-std", "embedded", "science"]
# the logo's sources and exports are for the README and rustdoc, which link them from GitHub; the book's site
# tooling builds docs/ into a website and isn't part of the crate (docs/ stays: a test reads docs/customary.md);
# fuzz/ is a crate of its own
exclude = ["assets/", "docs_ext/", "fuzz/", "overrides/", "tools/", "pyproject.toml", "uv.lock", "zensical.toml"]

[workspace]

[features]
default = ["std"]
# std enables every unit group but `customary`, like ww_si's; with `shrink_wrap` also the owned wire mirrors
std = ["shrink_wrap?/std", "serde?/std", "quantities"]
defmt = ["dep:defmt", "shrink_wrap?/defmt"]
# the wire format: SerializeShrinkWrap / DeserializeShrinkWrap for every type, SIExpr, Fixed over UNib32, UVlq*, Nibble
shrink_wrap = ["dep:shrink_wrap"]
# log10 and 10^x from libm (pure Rust) for `Fixed::to_db` / `from_db` and their f32 forms without std; with std
# too, so every target computes the same bits
libm = ["dep:libm"]
# serde for the numbers (Fixed, Complex, Point, Polar, indices, Decibels) as their stored values, bounds checked on
# reading, and `serde::with_unit` for "1.5 ms" text: no_std, no alloc. With `std` also Magnitude and Offset, with
# `std` and `shrink_wrap` the owned wire mirrors (DimOwned, CountedOwned, ProvenanceOwned), for RON snapshots of APIs
serde = ["dep:serde"]

# unit groups: a firmware enables the ones it uses, `quantities` all of them but `customary`
quantities = [
    "time",
    "electrical",
    "fields",
    "mechanical",
    "angle",
    "thermal",
    "chemical",
    "photometric",
    "radiometric",
    "radiation",
    "dimensionless",
    "information",
    "counting",
]
# Second, Minute, Hour, Day, Week, Hertz, HertzPerSecond, Baud; the UnixEpoch origin
time = []
# Ampere, Volt, Ohm, Farad, Siemens, Henry, Coulomb, Watt, VoltAmpere, Var, Weber, Tesla
electrical = []
# ElectricFieldStrength (V/m), MagneticFieldStrength (A/m), CurrentDensity (A/m²), ChargeDensity (C/m³),
# ElectricDisplacement (C/m²), Permittivity (F/m), Permeability (H/m), Resistivity (Ω·m), Conductivity (S/m)
fields = []
# Meter, Gram, Newton, Pascal, Joule, Torque, Litre, VolumetricFlow, Speed, Acceleration, Jerk, Snap, Yank; Area,
# Volume, Wavenumber, Density, GramPerCubicCentimeter, SurfaceDensity, SpecificVolume, MassFlow, Momentum,
# AngularMomentum, MomentOfInertia, SurfaceTension, DynamicViscosity, KinematicViscosity, EnergyDensity, PowerDensity
mechanical = []
# Radian, Degree, Turn, Steradian, AngularVelocity, AngularAcceleration: angle is a base dimension of its own
angle = []
# Kelvin, DegreeCelsius; HeatFluxDensity (W/m²), HeatCapacity and Entropy (J/K), SpecificHeatCapacity,
# ThermalConductivity, ThermalConductance (W/K), ThermalResistance (K/W), HeatTransferCoefficient
thermal = []
# Mole, Katal; MolarConcentration (mol/m³), MolePerLitre, Molality, MolarMass, GramPerMole, MolarEnergy,
# MolarHeatCapacity
chemical = []
# Candela, Lumen, Lux, Nit (cd/m²), LuminousEfficacy (lm/W)
photometric = []
# Irradiance (W/m²), RadiantIntensity (W/sr), Radiance (W/(m²·sr))
radiometric = []
# Becquerel, Gray, Sievert, ElectronVolt; Exposure (C/kg), AbsorbedDoseRate (Gy/s), SievertPerHour
radiation = []
# Ratio (duty, probability, scale): used next to any other group, so a group of its own
dimensionless = []
# Bit, Nibble (4 Bit), Byte (8 Bit), Halfword (2 Byte), Word (4 Byte), Doubleword (8 Byte): information, a base dimension of its own
information = []
# imperial, US customary and other units outside the SI: inch, pound, psi, gallon (US and imperial), Btu, hp, ...
# Opt-in only, not in `quantities` or `std`: an API without them pays nothing for them
customary = []
# Item, Sample, Frame, Packet, Line, Row, Record, Entry, Cycle, Block, Sector, Chunk, Char, Code: counted bases, each a dimension of its own
counting = []

[dependencies]
defmt = { version = "1.1", optional = true }
libm = { version = "0.2", default-features = false, optional = true }
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
# WireWeaver's wire format; from its repository until shrink_wrap 0.2 is on crates.io. wire_weaver itself
# [patch]es this source to its own shrink_wrap, so there is one shrink_wrap in its builds.
shrink_wrap = { version = "0.2.0", git = "https://github.com/vhrdtech/wire_weaver", default-features = false, optional = true }

[dev-dependencies]
# the reference the compile-time levels are tested against
libm = { version = "0.2", default-features = false }
# serde round trips (tests/serde.rs, tests/props) and arbitrary text into the serde impls (tests/props/serde_input.rs):
# a binary format without alloc and JSON
postcard = { version = "1.1", default-features = false }
serde_json = { version = "1.0", default-features = false, features = ["float_roundtrip", "std"] }

# property tests (tests/props); not under Kani, which runs the same properties as proofs (`just verify`)
[target.'cfg(not(kani))'.dev-dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }

# the wire: SIExpr, Dim and Scale bytes, Series of Fixed fields
[[test]]
name = "dynamic"
required-features = ["shrink_wrap"]

[[test]]
name = "series"
required-features = ["shrink_wrap"]

# serde of the numbers and the with_unit text
[[test]]
name = "serde"
required-features = ["serde"]

# examples/NN_*.rs: one story each, in reading order; the README's Examples section lists them
[[example]]
# the unit and scale in the type: µs and ms don't mix, a conversion is exact or refused, and no_std
name = "01_timer"
required-features = ["time"]

[[example]]
# °C and °F setpoints: a temperature is a point, a difference of two is an amount
name = "02_thermostat"
required-features = ["thermal"]

[[example]]
# bounded readings: a cell's range, a broken wire refused, a saturating charge counter
name = "03_battery"
required-features = ["electrical", "dimensionless", "time"]

[[example]]
# shunt current and power: product and quotient scales, overflow proven or checked
name = "04_motor_power"
required-features = ["electrical"]

[[example]]
# kinds: V/V is a gain, not a duty; V/A is a transimpedance, not a resistance
name = "05_light_sensor"
required-features = ["electrical", "dimensionless"]

[[example]]
# decibels: power or amplitude, levels at compile time, compare across bounds
name = "06_audio_limiter"
required-features = ["electrical", "libm"]

[[example]]
# overflow policies: a phase that wraps, a mix that saturates
name = "07_tone_generator"
required-features = ["dimensionless", "angle"]

[[example]]
# indices, sequence numbers and timestamps since boot
name = "08_data_logger"
required-features = ["counting", "time"]

[[example]]
# counted dimensions: samples, bytes and cycles; KiB and kB
name = "09_capture_buffer"
required-features = ["counting", "time", "information"]

[[example]]
# a unit with a root: nV/√Hz times √Hz
name = "10_adc_noise"
required-features = ["electrical", "time"]

[[example]]
# psi and gallons, exact and named: US or imperial, defined or measured
name = "11_us_customer"
required-features = ["customary"]

[[example]]
# the same bytes as the plain struct, read back typed
name = "12_wire"
required-features = ["shrink_wrap", "time", "electrical"]

[[example]]
# Γ, VSWR and return loss of an antenna; the firmware's |Γ| ≤ −15 dB as one integer compare
name = "13_impedance_match"
required-features = ["electrical", "angle", "dimensionless", "libm"]

[[example]]
# Q15 IQ: an NCO mixer, a complex multiply that saturates, an exact power sum
name = "14_iq_downconvert"
required-features = ["angle", "dimensionless", "electrical"]

[profile.dev]
split-debuginfo = "unpacked"

[profile.test]
split-debuginfo = "unpacked"

# `just install` / `just deploy`
[profile.deploy]
inherits = "release"
incremental = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `cargo kani` sets cfg(kani): the proofs in tests/props; `cargo fuzz` sets cfg(fuzzing): fuzz/ runs the properties
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(fuzzing)"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# pedantic, but for these: the house style writes names and formulas in prose (Q15, SIExpr, dB)
doc_markdown = "allow"
# #[inline(always)] on the small const fns a firmware calls in its loop is deliberate
inline_always = "allow"
# reference values are written digit for digit as their source prints them (NIST SP 811, libm)
unreadable_literal = "allow"
# the docs say when a function panics or errs in their first sentences, not under a heading
missing_panics_doc = "allow"
missing_errors_doc = "allow"
# formulas name their terms as the source does (a, b, c, d; p, q; x, y)
many_single_char_names = "allow"
# a test or an example declares the type it needs where it first uses it
items_after_statements = "allow"
# fires in the code derive_shrink_wrap generates for Complex, out of reach of an #[expect]
used_underscore_binding = "allow"
# every cast that can lose, wrap or round says why it can't here, or is From/TryFrom
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
# a cast is `From`/`TryFrom`; `as` only where nothing else fits (const fn, float <-> int), with its reason
as_conversions = "warn"
absolute_paths = "warn"
# every suppression is an #[expect(.., reason = "..")]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# no_std first: core, then alloc, before std
std_instead_of_core = "warn"
alloc_instead_of_core = "warn"
# no panics a caller didn't ask for in library code (tests may, clippy.toml)
unwrap_used = "warn"
expect_used = "warn"
unreachable = "warn"
panic = "warn"
# a slice or an array is read with get, split_at_checked or an iterator; an index only where a const fn needs it
indexing_slicing = "warn"
# every overflowable op says what it means: checked_, wrapping_, saturating_, or an #[expect] with its invariant
arithmetic_side_effects = "warn"
todo = "warn"
unimplemented = "warn"
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
float_cmp = "warn"
lossy_float_literal = "warn"
