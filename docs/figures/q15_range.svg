<svg class="eu-svg" viewBox="0 0 640 150" width="640" height="150" role="img" aria-label="Q15 covers -1 to 1 minus 2 to the -15 in 65536 steps" xmlns="http://www.w3.org/2000/svg">
  <rect x="60" y="58" width="496" height="12" rx="2" class="faint"/>
  <line x1="40" y1="70" x2="590" y2="70" class="thin"/>
  <line x1="60" y1="60" x2="60" y2="80" class="line"/>
  <text x="60" y="98" text-anchor="middle">−1</text>
  <text x="60" y="116" text-anchor="middle" class="mono soft">0x8000</text>
  <line x1="185.0" y1="60" x2="185.0" y2="80" class="line"/>
  <text x="185.0" y="98" text-anchor="middle">−0.5</text>
  <text x="185.0" y="116" text-anchor="middle" class="mono soft">0xc000</text>
  <line x1="310" y1="60" x2="310" y2="80" class="line"/>
  <text x="310" y="98" text-anchor="middle">0</text>
  <text x="310" y="116" text-anchor="middle" class="mono soft">0x0000</text>
  <line x1="435.0" y1="60" x2="435.0" y2="80" class="line"/>
  <text x="435.0" y="98" text-anchor="middle">0.5</text>
  <text x="435.0" y="116" text-anchor="middle" class="mono soft">0x4000</text>
  <line x1="556" y1="60" x2="556" y2="80" class="accent-line"/>
  <text x="556" y="98" text-anchor="middle" class="accent">1 − 2⁻¹⁵</text>
  <text x="556" y="116" text-anchor="middle" class="mono soft">0x7fff</text>
  <circle cx="560" cy="70" r="5" class="thin" style="fill:none;stroke-width:1.5"/>
  <text x="585" y="40" text-anchor="end" class="soft">1 itself: not a Q15 value</text>
  <text x="60" y="40" class="soft">65536 steps of 2⁻¹⁵</text>
</svg>
