[package]
name = "exact_units-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# cargo-machete reads only fuzz_targets/*.rs's own `use`s, not the tests/props modules they pull in by #[path]
# (fuzz_targets/props.rs): each of these is used there, not in a fuzz_targets file directly.
[package.metadata.cargo-machete]
ignored = [
    # tests/props/reference.rs, exact_text.rs, q_text.rs, registry.rs, serde_input.rs, text.rs and wire.rs call it
    "exact_units",
    # tests/props/serde_input.rs derives Serialize/Deserialize and reads JSON through serde's Deserializer
    "serde",
    # tests/props/serde_input.rs reads arbitrary text as serde_json::Value and round-trips it
    "serde_json",
    # tests/props/wire.rs encodes and decodes the crate's shrink_wrap types
    "shrink_wrap",
]

# a workspace of its own: the crate's builds, tests and lints never see this one (it needs nightly and libFuzzer)
[workspace]

# the features of exact_units the property functions ask for with cfg(feature = ..), all on
[features]
default = ["bignum", "customary", "leap_seconds", "serde", "shrink_wrap", "std"]
bignum = ["exact_units/bignum"]
customary = ["exact_units/customary"]
leap_seconds = ["exact_units/leap_seconds"]
serde = ["exact_units/serde"]
shrink_wrap = ["exact_units/shrink_wrap"]
std = ["exact_units/std"]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
exact_units = { path = "..", features = ["shrink_wrap"] }
libfuzzer-sys = "0.4"
serde = "1.0"
serde_json = { version = "1.0", default-features = false, features = ["std"] }
shrink_wrap = { version = "0.2.0", git = "https://github.com/vhrdtech/wire_weaver", default-features = false, features = ["std"] }

[lints.rust]
# cfg(kani) and cfg(fuzzing) pick what of tests/props is compiled in. The feature values are exact_units' unit
# groups: tests/props' modules are shared with tests/props/reference.rs's own test crate, which turns them all on,
# so they appear in #[cfg(feature = ..)] here too even though this crate forwards only a handful of them.
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(kani)",
    "cfg(fuzzing)",
    "cfg(feature, values(\"angle\", \"counting\", \"dimensionless\", \"electrical\", \"information\", \"levels\", \"libm\", \"mechanical\", \"photometric\", \"q\", \"quantities\", \"radiation\", \"systems\", \"thermal\", \"time\"))",
] }

# Each target calls a property function of tests/props, compiled in by path (see props.rs).

[[bin]]
name = "decimal"
path = "fuzz_targets/decimal.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decibels"
path = "fuzz_targets/decibels.rs"
test = false
doc = false
bench = false

[[bin]]
name = "names"
path = "fuzz_targets/names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registry"
path = "fuzz_targets/registry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_bytes"
path = "fuzz_targets/wire_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unit_table"
path = "fuzz_targets/unit_table.rs"
test = false
